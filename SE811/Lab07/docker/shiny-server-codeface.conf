# Shiny Server configuration for the Codeface web frontend.
#
# This is the repository's own shiny-server.config with two changes:
#
#   1. Absolute paths. The original uses paths relative to the Codeface
#      checkout ("site_dir codeface/R/shiny"), which only works if the server
#      is started from that directory. Shiny Server resolves these against its
#      own working directory, so they are made absolute here.
#
#   2. A run_as directive, which Shiny Server requires and the original omits
#      (the JohannesEbke "no-su" fork it targeted ran without privilege
#      dropping, which is why it needed no such setting).
#
# Serving the whole site_dir -- rather than a single app via `codeface
# dynamic` -- is what makes the frontend's navigation work: the breadcrumb
# links are *relative* ("../dashboard/?projectid=2"), so every app has to be
# mounted under its own URL path beneath a common parent.
#
# Entry point:  http://localhost:8081/apps/projects/

# Must be a non-root account. Shiny Server merely *warns* about `run_as root`
# at startup, then hard-refuses at request time with
#   Error getting worker: Error: Aborting attempt to launch worker process as root
# so the failure shows up as an HTTP 500 with empty app logs. The `shiny`
# account is created by the shiny-server package; see serve_frontend.sh for the
# two permissions it needs (write access to the log directories).
run_as shiny;

# Keep per-app R logs even when a worker exits cleanly. Without this Shiny
# Server deletes them on success, which makes a failing app look like it
# produced no diagnostics at all.
preserve_logs true;

server {
  listen 8081;

  location / {
    site_dir /codeface/codeface/R/shiny;
    log_dir  /var/log/shiny-server;
    directory_index on;
  }
}
